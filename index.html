<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Base Convert — Binary, Octal, Decimal, Hex &amp; Any Base Converter | S3eidat Tools</title>
<meta name="description" content="Convert numbers of any size between binary, octal, decimal, hex and bases 2–36. Two's complement for 8/16/32/64 bits, clickable bit grid, and UTF-8 text to hex/binary. Free and private.">
<meta property="og:title" content="Base Convert — binary, octal, decimal, hex and any base">
<meta property="og:description" content="Arbitrary-size base conversion, two's complement, bit grid, text to bytes. Runs in your browser.">
<meta property="og:image" content="screenshot.png">
<link rel="icon" href="kit/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="app.css">
<script src="kit/kit.js"></script>
</head>
<body data-tool="base-convert">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Base Convert</h1>
    <p>Convert whole numbers of any size between binary, octal, decimal, hex and any base from 2 to 36. See two's complement, flip bits, and turn text into bytes.</p>
  </section>

  <div class="grid-2 bc-grid">
    <section class="card stack">
      <div class="row between">
        <h2>Number</h2>
        <span class="chip" id="status">Type a number</span>
      </div>
      <label class="field">Value
        <input class="input big-in mono" id="value" autocomplete="off" spellcheck="false" dir="ltr" placeholder="255, 0xff, 0b1111_1111, -42…">
      </label>
      <div class="row">
        <span class="faint">Input base</span>
        <div class="seg" id="base-seg" role="group" aria-label="Input base">
          <button aria-pressed="true" data-v="auto">Auto</button>
          <button aria-pressed="false" data-v="2">2</button>
          <button aria-pressed="false" data-v="8">8</button>
          <button aria-pressed="false" data-v="10">10</button>
          <button aria-pressed="false" data-v="16">16</button>
        </div>
        <label class="field inline">Other
          <select class="select" id="base-any" aria-label="Any input base"></select>
        </label>
      </div>
      <div class="rows" id="outs"></div>
      <div class="row">
        <label class="check"><input type="checkbox" id="group" checked> Group digits</label>
        <label class="check"><input type="checkbox" id="upper" checked> Uppercase</label>
        <span class="grow"></span>
        <span class="faint" id="bits"></span>
      </div>
    </section>

    <section class="card stack">
      <div class="row between">
        <h2>Two's complement</h2>
        <div class="seg" id="width-seg" role="group" aria-label="Bit width">
          <button aria-pressed="false" data-v="8">8</button>
          <button aria-pressed="false" data-v="16">16</button>
          <button aria-pressed="true" data-v="32">32</button>
          <button aria-pressed="false" data-v="64">64</button>
        </div>
      </div>
      <div class="stats" id="tc-stats"></div>
      <p class="faint" id="tc-note"></p>
      <div class="bitgrid" id="bitgrid" role="group" aria-label="Bits, click to toggle"></div>
      <div class="row">
        <span class="faint">Clicking a bit gives</span>
        <div class="seg" id="sign-seg" role="group" aria-label="Interpret bits as">
          <button aria-pressed="true" data-v="u">Unsigned</button>
          <button aria-pressed="false" data-v="s">Signed</button>
        </div>
        <span class="grow"></span>
        <button class="btn ghost small" id="invert">Invert all</button>
      </div>
    </section>
  </div>

  <section class="card mt">
    <div class="row between">
      <h2>Text ↔ bytes <small>UTF-8</small></h2>
      <div class="seg" id="byte-seg" role="group" aria-label="Byte format">
        <button aria-pressed="true" data-v="hex">Hex</button>
        <button aria-pressed="false" data-v="bin">Binary</button>
        <button aria-pressed="false" data-v="dec">Decimal</button>
      </div>
    </div>
    <div class="grid-2 mt">
      <label class="field">Text
        <textarea class="textarea prose" id="text" dir="auto" spellcheck="false" placeholder="Type text here, Arabic and emoji welcome"></textarea>
      </label>
      <label class="field"><span class="row between"><span>Bytes</span><span class="faint" id="byte-info"></span></span>
        <textarea class="textarea" id="bytes" dir="ltr" spellcheck="false" placeholder="48 65 6C 6C 6F"></textarea>
      </label>
    </div>
    <div class="row mt">
      <button class="btn small" id="copy-text"><svg class="i"><use href="#i-copy"/></svg>Copy text</button>
      <button class="btn small" id="copy-bytes"><svg class="i"><use href="#i-copy"/></svg>Copy bytes</button>
      <span class="chip" id="byte-status"></span>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
